; Voxel-ECS runtime configuration

; Keep data lookup inside the Client project folder
data.folder = ./data/

; Use scene manifest and main entry scene
; (these are defaults in code, kept explicit for stability)
game.prefab_manifest = prefab.manifest
game.start_prefab = main
game.level_layout = level.layouts

; Gameplay defaults
game.timer = 120
update_fps = 60
camera.sensitivity = 0.001
